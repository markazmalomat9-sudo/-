.mk small{display:block;font-size:12.5px;color:var(--mut);line-height:1.35}.mk b{display:block;font-size:21px;line-height:1.25}.mk i{font-style:normal;font-size:12px}
.k3{gap:10px}.k3>.mk:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 5px)}.k3.one>.mk{width:100%}.fr{padding:14px}
@media(max-width:760px){.k3>.mk:last-child:nth-child(odd){width:100%}}
:root{--bg:#f6f5f1;--card:#fff;--ink:#1f2937;--mut:#6b7280;--line:#e8e4da;--zb:#faf9f5;--prv:#d6d3c8;--pri:#1f3a6b;--pri2:#eceff6;--hd:#14284b;--gold:#c9a24d;--g:linear-gradient(135deg,#14284b 0%,#1b3562 60%,#274678 100%);--sh:0 2px 10px rgba(20,40,75,.08)}
:root[data-theme=dark]{--bg:#11161f;--card:#1a212d;--ink:#e6e8ee;--mut:#9aa3b2;--line:#2b3446;--zb:#202838;--prv:#4a556b;--pri:#9bb4e0;--pri2:#222c42;--hd:#0f1b33;--gold:#d8b35e;--g:linear-gradient(135deg,#0f1b33 0%,#16294a 60%,#1e3860 100%);--sh:0 2px 10px rgba(0,0,0,.3)}
header{border-bottom:3px solid var(--gold)}.by2 b{color:#e6c77a}
nav button.on{box-shadow:inset 0 -3px 0 var(--gold),0 4px 12px rgba(20,40,75,.22)}
.k,.k.hot{border-top-color:var(--gold)}.sec:before{background:var(--gold)}.hc:before{background:var(--gold)}.cap i{background:linear-gradient(90deg,var(--pri),var(--gold))}
.info{border-inline-start-color:var(--gold)}.bdg{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--ink)}
:root{--pri:#27487f;--hd:#1d3a6e;--g:linear-gradient(135deg,#1d3a6e 0%,#27487f 60%,#35598f 100%)}
:root[data-theme=dark]{--hd:#16294a;--g:linear-gradient(135deg,#16294a 0%,#1e3860 60%,#284874 100%)}
.mi.sm{width:32px;height:32px;border-radius:10px;display:inline-grid;vertical-align:middle;margin-inline-end:8px}.mi.sm svg{width:18px;height:18px}.mi{width:46px;height:46px}.mi svg{width:24px;height:24px}

/* ===== v9: تحديثات الشكل والبطاقات ===== */
:root[data-theme=dark]{--bg:#0b1420;--card:#122032;--zb:#17283b;--line:#24394f;--ink:#e8eef6;--mut:#97a9bd;--gold:#e6c77a;--prv:#4d647c;--pri:#8fb8e8;--pri2:#16314a;--hd:#0c2744;--up:#4cc78b;--dn:#f0786e;--g:linear-gradient(135deg,#0c2744 0%,#14385f 60%,#1b4b78 100%);--sh:0 2px 12px rgba(0,0,0,.35)}
:root[data-theme=dark] header{background:linear-gradient(180deg,#0c2744 0%,#14385f 55%,#1b4b78 100%)}
:root[data-theme=dark] input,:root[data-theme=dark] select{background:#0f1c2b}
.tl{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;overflow:hidden;min-width:0}
.tl:before{content:"";position:absolute;inset-inline:0;top:0;height:4px;background:var(--c);border-radius:16px 16px 0 0}
.tl .top{display:flex;align-items:center;gap:10px;margin-top:2px}
.tl .top small{color:var(--mut);font-size:12.5px;line-height:1.35;font-weight:600}
.tl .mi{width:38px;height:38px;border-radius:11px}.tl .mi svg{width:20px;height:20px}
.tl b.v{display:block;font-size:24px;line-height:1.3;margin:8px 0 6px}
.tl .nm{font-weight:700;font-size:15px;margin-top:8px;line-height:1.4}
.tl .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px}
.tl .sp{width:46px;height:24px;flex:none}.tl .sh{font-size:11.5px;color:var(--mut)}
.pc{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;direction:ltr;display:inline-block}
.pc.u{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)}
.pc.d{background:color-mix(in srgb,var(--dn) 16%,transparent);color:var(--dn)}
.pc.z{background:var(--zb);color:var(--mut)}
.gc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh);min-width:0}
.gc>.sec{margin-top:0}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tg4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.g3c{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
@media(max-width:1000px){.g3c{grid-template-columns:1fr}}
@media(max-width:520px){.tl b.v{font-size:21px}.tl .top small{font-size:12px}.tl .sp{width:36px}}
.lvp{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:color-mix(in srgb,var(--lc) 28%,transparent);border:1px solid var(--lc);color:var(--ink)}
.card details summary{cursor:pointer;color:var(--pri);font-weight:600;margin:12px 0 8px}
.svs{display:grid;grid-template-columns:150px repeat(4,minmax(0,1fr));gap:12px;align-items:stretch}
.svp{background:color-mix(in srgb,#e0a030 12%,transparent);border:1px solid color-mix(in srgb,#e0a030 40%,transparent);border-radius:16px;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.svp small{color:var(--mut);font-weight:600;font-size:12.5px}
.svd{position:relative;width:104px;height:104px}.svd canvas{width:100%!important;height:100%!important}.svd span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:20px;color:#e0a030;direction:ltr}
.svt{border-radius:16px;padding:16px 8px;text-align:center;cursor:pointer;border:2px solid transparent;background:color-mix(in srgb,var(--sc) 13%,transparent);transition:.15s}
.svt b{display:block;font-size:34px;line-height:1.2;color:var(--sc)}
.svt strong{display:block;font-size:15px;margin-top:2px}
.svt small{color:var(--mut);font-size:12px}
.svt:hover{border-color:color-mix(in srgb,var(--sc) 60%,transparent)}
.svt.sel{border-color:var(--sc)}
.svt.all{--sc:#3aa0c4}.svt.g{--sc:#1fa774}.svt.y{--sc:#e0a030}.svt.r{--sc:#d1453b}
.svlg{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0 0;font-size:12.5px;color:var(--mut);font-weight:600}
.svlg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:5px;vertical-align:middle}
.svl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:12px}
.svl[hidden],.svi[hidden]{display:none!important}
.svi{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--zb);border-inline-start:4px solid var(--sc);font-size:13.5px}
.svi.g{--sc:#1fa774}.svi.y{--sc:#e0a030}.svi.r{--sc:#d1453b}
.svi em{margin-inline-start:auto;font-style:normal;font-size:12px;color:var(--mut);white-space:nowrap}
@media(max-width:760px){.svs{grid-template-columns:1fr 1fr}.svp{grid-column:1/-1}}
